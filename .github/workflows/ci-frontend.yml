name: Static frontend CI
on:
  pull_request:
    paths: ["sql-genius-frontend/**", ".github/workflows/ci-frontend.yml"]
  push:
    branches: [main]
    paths: ["sql-genius-frontend/**", ".github/workflows/ci-frontend.yml"]
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sql-genius-frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:static
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: static-browser-evidence
          path: sql-genius-frontend/test-results/
          retention-days: 7
