name: Backend CI
on:
  pull_request:
    paths:
      - "backend/**"
      - "scripts/check-backend.sh"
      - ".github/workflows/ci-backend.yml"
      - "Dockerfile.backend"
      - "infrastructure/docker/Dockerfile*"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "scripts/check-backend.sh"
      - ".github/workflows/ci-backend.yml"
      - "Dockerfile.backend"
      - "infrastructure/docker/Dockerfile*"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Python 3.11 and pip cache
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Report versions
        run: ../scripts/check-backend.sh versions
      - name: Validate dependencies
        run: ../scripts/check-backend.sh deps
      - name: Lint backend
        run: ../scripts/check-backend.sh lint
      - name: Type-check backend
        run: ../scripts/check-backend.sh types
      - name: Run offline backend tests
        run: ../scripts/check-backend.sh tests
