name: Optional backend container check
on:
  pull_request:
    paths: ["backend/**", "Dockerfile.backend", ".dockerignore", "scripts/**", ".github/workflows/ci-container.yml"]
  push:
    branches: [main]
    paths: ["backend/**", "Dockerfile.backend", ".dockerignore", "scripts/**", ".github/workflows/ci-container.yml"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.backend
          push: false
