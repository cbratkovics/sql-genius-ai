[mypy]
python_version = 3.11
check_untyped_defs = True
no_implicit_optional = True
warn_unused_ignores = True
warn_redundant_casts = True
show_error_codes = True
explicit_package_bases = True
mypy_path = $MYPY_CONFIG_FILE_DIR/..

# These optional integration SDKs have no complete upstream PEP 561 support.
# Only their imports are exempt; retained backend functions are still checked.
[mypy-celery.*,sklearn.*,sqlparse.*,kombu.*]
ignore_missing_imports = True
